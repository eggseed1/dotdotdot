name: Build music catalog in the cloud
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sample = quick smoke test; dump = official MusicBrainz bulk snapshot (high disk use)"
        type: choice
        options: [sample, dump]
        default: sample
      limit:
        description: "Maximum albums to export (0 = all in dump mode)"
        type: number
        default: 5000
      include_community_tags:
        description: "I confirm noncommercial CC BY-NC-SA 3.0 obligations; fetch derived tags and rating counts"
        type: boolean
        default: false
      deploy_pages:
        description: "Deploy catalog with website when below Pages size limit"
        type: boolean
        default: true
      publish_release:
        description: "Publish resulting small catalog as GitHub Release assets (no site deployment)"
        type: boolean
        default: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: music-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Show available disk
        run: df -h . && free -h
      - name: Import sample (not comprehensive)
        if: ${{ inputs.mode == 'sample' }}
        env:
          CATALOG_CONTACT_EMAIL: ${{ secrets.CATALOG_CONTACT_EMAIL }}
          MAX_ALBUMS: ${{ inputs.limit }}
        run: |
          if [ -z "$CATALOG_CONTACT_EMAIL" ]; then
            echo "Set Actions secret CATALOG_CONTACT_EMAIL to a real contact email, required for MusicBrainz API etiquette."
            exit 1
          fi
          node scripts/fetch-musicbrainz.mjs --limit "$MAX_ALBUMS" --out /tmp/music-sample.jsonl
          node scripts/import-catalog.mjs --source musicbrainz --file /tmp/music-sample.jsonl --db data/catalog.sqlite
      - name: Fetch official MusicBrainz core and optional supplementary archive
        if: ${{ inputs.mode == 'dump' }}
        env:
          COMMUNITY: ${{ inputs.include_community_tags }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mbdata/mbdump
          echo "GitHub-hosted runners have limited ephemeral disk; full archive processing may exhaust capacity."
          SNAPSHOT="$(curl -fsSL --retry 3 https://ftp.musicbrainz.org/pub/musicbrainz/data/fullexport/LATEST | tr -d '\r\n')"
          case "$SNAPSHOT" in *[!0-9-]*|'') echo "Unexpected snapshot ID"; exit 1;; esac
          BASE="https://ftp.musicbrainz.org/pub/musicbrainz/data/fullexport/$SNAPSHOT"
          curl -fL --retry 3 "$BASE/mbdump.tar.bz2" -o /tmp/mbdata/core.tar.bz2
          # Extract only tables required by the importer, not the entire archive.
          tar -xjf /tmp/mbdata/core.tar.bz2 -C /tmp/mbdata \
            mbdump/artist mbdump/artist_credit mbdump/artist_credit_name \
            mbdump/area mbdump/iso_3166_1 mbdump/release_group \
            mbdump/release_group_primary_type mbdump/release mbdump/release_country \
            mbdump/release_unknown_country mbdump/genre \
            mbdump/release_group_alias mbdump/artist_alias
          rm /tmp/mbdata/core.tar.bz2
          if [ "$COMMUNITY" = true ]; then
            echo "Derived metadata licensed CC BY-NC-SA 3.0: attribution and share-alike required."
            curl -fL --retry 3 "$BASE/mbdump-derived.tar.bz2" -o /tmp/mbdata/derived.tar.bz2
            mkdir -p /tmp/mbdata/derived
            tar -xjf /tmp/mbdata/derived.tar.bz2 -C /tmp/mbdata/derived \
              mbdump/tag mbdump/release_group_tag mbdump/release_group_meta
            mv /tmp/mbdata/derived/mbdump/* /tmp/mbdata/derived/
            rm /tmp/mbdata/derived.tar.bz2
          fi
          df -h .
      - name: Import official bulk dataset
        if: ${{ inputs.mode == 'dump' }}
        env:
          COMMUNITY: ${{ inputs.include_community_tags }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          OPTS=()
          if [ "$COMMUNITY" = true ]; then
            OPTS+=(--derived-dir /tmp/mbdata/derived --allow-noncommercial)
          fi
          if [ "$LIMIT" != 0 ]; then
            OPTS+=(--limit "$LIMIT")
          fi
          node scripts/import-musicbrainz-core.mjs --dump-dir /tmp/mbdata/mbdump --db data/catalog.sqlite "${OPTS[@]}"
      - name: Export searchable static JSON shards
        run: |
          node scripts/build-static-catalog.mjs --db data/catalog.sqlite --out public/catalog-shards
          du -sh data/catalog.sqlite public/catalog-shards
          cat public/catalog-shards/manifest.json | head -c 500
      - name: Check catalog files can build on Pages
        run: npm run build
      - name: Check Pages site size
        id: sizecheck
        run: |
          BYTES=$(du -sb dist | cut -f1)
          echo "Site size: $BYTES bytes"
          if [ "$BYTES" -lt 900000000 ]; then echo "fits=true" >> "$GITHUB_OUTPUT"; else echo "fits=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/configure-pages@v5
        if: ${{ inputs.deploy_pages && steps.sizecheck.outputs.fits == 'true' }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.deploy_pages && steps.sizecheck.outputs.fits == 'true' }}
        with:
          path: ./dist
      - name: Deploy catalog to GitHub Pages
        id: pages
        if: ${{ inputs.deploy_pages && steps.sizecheck.outputs.fits == 'true' }}
        uses: actions/deploy-pages@v4
      - name: Create downloadable catalog tarball
        run: |
          mkdir -p out
          tar -czf out/larper101-catalog-shards.tar.gz -C public catalog-shards
          du -h out/*
      - name: Upload catalog build artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog-shards-${{ github.run_number }}
          path: out/larper101-catalog-shards.tar.gz
          retention-days: 7
      - name: Publish current catalog for future deployments
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SIZE=$(stat -c %s out/larper101-catalog-shards.tar.gz)
          if [ "$SIZE" -gt 1900000000 ]; then
            echo "Catalog archive is too large for one Release asset; split exports are needed."
            exit 1
          fi
          cp out/larper101-catalog-shards.tar.gz out/catalog-shards.tar.gz
          if gh release view catalog-current --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload catalog-current out/catalog-shards.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create catalog-current out/catalog-shards.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --title "Current searchable music catalog" \
              --notes "Imported MusicBrainz catalog; metadata coverage and rarity evidence may be incomplete." \
              --latest=false
          fi
